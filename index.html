<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapLoad | Video Downloader</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #0099ff;
            --bg: #0a0a0f;
            --card-bg: #151520;
            --input-bg: #1a1a25;
            --text: #ffffff;
            --border: #2a2a35;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 90%; max-width: 500px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        p { color: #888; margin-bottom: 30px; }
        input { width: 100%; padding: 18px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 12px; color: white; font-size: 1rem; outline: none; margin-bottom: 20px; box-sizing: border-box; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 12px; color: #000; font-size: 1rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        #result { margin-top: 30px; display: none; }
        .thumbnail { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .loader { display: none; margin: 20px auto; width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.1); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>SnapLoad</h1>
        <p>Instagram, TikTok, YouTube ve fazlası...</p>
        <form id="dlForm">
            <input type="url" name="url" placeholder="Link yapıştır..." required>
            <button type="submit" id="btn">Analiz Et</button>
        </form>
        <div class="loader" id="loader"></div>
        <div id="result">
            <img id="thumb" class="thumbnail" src="">
            <div id="title" style="margin-bottom:15px;"></div>
            <a id="link" href="" target="_blank"><button style="background:#fff;">İndir</button></a>
        </div>
    </div>
    <script>
        const form = document.getElementById('dlForm');
        form.onsubmit = async (e) => {
            e.preventDefault();
            document.getElementById('loader').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            const res = await fetch('/indir', { method: 'POST', body: new FormData(form) });
            const data = await res.json();
            document.getElementById('loader').style.display = 'none';
            if(data.url) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('thumb').src = data.thumb;
                document.getElementById('title').innerText = data.title;
                document.getElementById('link').href = data.url;
            } else { alert('Hata!'); }
        };
    </script>
</body>
</html>
